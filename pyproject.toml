[project]
name = "fintech-skilled-agents"
version = "0.1.0"
description = "Multi-agent system with progressive disclosure skills for fintech AML/Fraud detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Fintech Team", email = "team@fintech.com" }
]

dependencies = [
    # LangChain ecosystem
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",

    # LLM Providers
    "openai>=1.0.0",
    "httpx>=0.27.0",

    # Data processing
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "polars>=0.20.0",
    "faker>=22.0.0",

    # UI
    "gradio>=4.0.0",

    # Graph visualization
    "networkx>=3.0",
    "pyvis>=0.3.0",

    # Utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "structlog>=24.0.0",

    # Date/time
    "pendulum>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
